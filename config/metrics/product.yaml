incident:
  label: Status-page incident
  unit: incident (count 1 each)
  definition: One incident posted on the company's public status page, with the company's own impact rating, first-post time and resolved time.
  aggregation: sum
  higher_is: bad
model_release:
  label: Model release
  unit: model (count 1 each)
  definition: One model named in an Anthropic announcement or API release note, dated by that page.
  aggregation: sum
  higher_is: neutral
api_price_input_usd_mtok:
  label: API input price
  unit: USD per million tokens
  definition: List price for input tokens, from an official pricing page or the price field reported by the named comparison platform. Excludes batch, caching and long-context rates.
  aggregation: last
  higher_is: neutral
api_price_output_usd_mtok:
  label: API output price
  unit: USD per million tokens
  definition: List price for output tokens, from an official pricing page or the price field reported by the named comparison platform. Excludes batch, caching and long-context rates.
  aggregation: last
  higher_is: neutral
plan_price_usd_month:
  label: Plan price
  unit: USD per month
  definition: Published monthly price of the named plan on the stated billing basis, as shown on the cited official pricing page the day retrieved.
  aggregation: last
  higher_is: neutral
openrouter_request_share:
  label: OpenRouter request share
  unit: fraction
  definition: Share of public requests attributed to a model author in OpenRouter's trailing-seven-day ranking; not total market share or user share.
  aggregation: last
  higher_is: neutral
openrouter_request_change:
  label: OpenRouter request change
  unit: fraction
  definition: Change in an author's public request count versus the prior period in OpenRouter's trailing-seven-day ranking.
  aggregation: last
  higher_is: neutral
public_adoption_count:
  label: Public adoption disclosure
  unit: count as stated
  definition: Company-stated count exactly as scoped in the cited disclosure. Scopes and periods differ and the values are not directly comparable.
  aggregation: last
  higher_is: neutral
openrouter_aa_intelligence_index:
  label: Intelligence Index (via OpenRouter)
  unit: index points
  definition: Artificial Analysis's composite model-quality score, relayed unchanged by OpenRouter's benchmarks endpoint. Higher is better; attribute it to Artificial Analysis.
  aggregation: last
  higher_is: good
openrouter_aa_coding_index:
  label: Coding Index (via OpenRouter)
  unit: index points
  definition: Artificial Analysis's coding composite, relayed unchanged by OpenRouter's benchmarks endpoint.
  aggregation: last
  higher_is: good
openrouter_aa_agentic_index:
  label: Agentic Index (via OpenRouter)
  unit: index points
  definition: Artificial Analysis's agentic-task composite, relayed unchanged by OpenRouter's benchmarks endpoint.
  aggregation: last
  higher_is: good
openrouter_eval_accuracy:
  label: OpenRouter eval accuracy
  unit: fraction of tasks
  definition: Share of tasks a model solved in OpenRouter's own evaluation (GPQA Diamond or tau-bench verified airline), from the dims' benchmark, with the standard deviation, task count and average cost per task alongside.
  aggregation: last
  higher_is: good
