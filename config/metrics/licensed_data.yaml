panel_spend_usd:
  label: Panel spend
  unit: USD per week
  definition: Spend by a vendor's consumer or business panel on the company's products in the week, as reported by the vendor (usually a projection from a card or receipts panel, not the company's revenue).
  aggregation: sum
  higher_is: good
panel_users:
  label: Panel users
  unit: users per week
  definition: Paying or active users of the company's products in the week, as estimated by the vendor's panel, projected to the population the vendor states.
  aggregation: last
  higher_is: good
panel_growth_yoy:
  label: Panel growth, year on year
  unit: ratio (0.25 = +25%)
  definition: The vendor's own year-on-year growth rate for the series, as published in its report. Enter it as a ratio, not a percent.
  aggregation: last
  higher_is: good
