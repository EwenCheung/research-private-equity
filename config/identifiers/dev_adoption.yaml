# How each company is found in the developer-adoption sources. Verified live on 2026-10-05.
# sdk_*: the company's official API SDKs (legacy SDKs are summed with their successors).
# cli_npm: the company's coding-agent CLI on npm.
anthropic:
  sdk_pypi: [anthropic]
  sdk_npm: ["@anthropic-ai/sdk"]
  cli_npm: "@anthropic-ai/claude-code"
  coauthor_trailer: "Co-Authored-By: Claude"
openai:
  sdk_pypi: [openai]
  sdk_npm: [openai]
  cli_npm: "@openai/codex"
google-deepmind:
  sdk_pypi: [google-genai, google-generativeai]
  sdk_npm: ["@google/genai", "@google/generative-ai"]
  cli_npm: "@google/gemini-cli"
xai:
  sdk_pypi: [xai-sdk]
mistral:
  sdk_pypi: [mistralai]
  sdk_npm: ["@mistralai/mistralai"]
cohere:
  sdk_pypi: [cohere]
  sdk_npm: [cohere-ai]
