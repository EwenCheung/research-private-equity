name: ci

# Every PR (implementation -> phase/N, phase/N -> main) must pass lint and tests before merge.
on:
  pull_request:
  push:
    branches: [main, "phase/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
