incident:
  label: Status-page incident
  unit: incident (count 1 each)
  definition: One incident posted on the company's public status page, with the company's own impact rating, first-post time and resolved time.
  aggregation: sum
  higher_is: bad
model_release:
  label: Model release
  unit: model (count 1 each)
  definition: One model named in an Anthropic announcement or API release note, dated by that page.
  aggregation: sum
  higher_is: neutral
api_price_input_usd_mtok:
  label: API input price
  unit: USD per million tokens
  definition: List price for input tokens, from an official pricing page or the price field reported by the named comparison platform. Excludes batch, caching and long-context rates.
  aggregation: last
  higher_is: neutral
api_price_output_usd_mtok:
  label: API output price
  unit: USD per million tokens
  definition: List price for output tokens, from an official pricing page or the price field reported by the named comparison platform. Excludes batch, caching and long-context rates.
  aggregation: last
  higher_is: neutral
plan_price_usd_month:
  label: Plan price
  unit: USD per month
  definition: Published monthly price of the named plan on the stated billing basis, as shown on the cited official pricing page the day retrieved.
  aggregation: last
  higher_is: neutral
arena_text_score:
  label: Arena text score
  unit: Arena score
  definition: Human-preference score reported for a model on Arena's text leaderboard. Model variants and reasoning levels are separate entries.
  aggregation: last
  higher_is: good
arena_text_votes:
  label: Arena text votes
  unit: votes
  definition: Number of human-preference votes shown for a model on Arena's text leaderboard.
  aggregation: last
  higher_is: neutral
context_window_tokens:
  label: Context window
  unit: tokens
  definition: Maximum context-window tokens reported for a model by the named comparison platform.
  aggregation: last
  higher_is: neutral
openrouter_request_share:
  label: OpenRouter request share
  unit: fraction
  definition: Share of public requests attributed to a model author in OpenRouter's trailing-seven-day ranking; not total market share or user share.
  aggregation: last
  higher_is: neutral
openrouter_request_change:
  label: OpenRouter request change
  unit: fraction
  definition: Change in an author's public request count versus the prior period in OpenRouter's trailing-seven-day ranking.
  aggregation: last
  higher_is: neutral
artificial_analysis_intelligence_index:
  label: Artificial Analysis Intelligence Index
  unit: index points
  definition: Composite model-quality score published by Artificial Analysis from its current weighted benchmark suite.
  aggregation: last
  higher_is: good
artificial_analysis_cost_per_task_usd:
  label: Artificial Analysis cost per task
  unit: USD per benchmark task
  definition: Weighted-average model cost to complete one task in the Artificial Analysis Intelligence Index workload, based on actual input, cached-input and output tokens consumed.
  aggregation: last
  higher_is: neutral
artificial_analysis_output_tokens_s:
  label: Artificial Analysis output speed
  unit: output tokens per second
  definition: Median output generation speed after the first token, in OpenAI-standard tokens per second, as published by Artificial Analysis.
  aggregation: last
  higher_is: good
artificial_analysis_first_chunk_seconds:
  label: Artificial Analysis first-chunk latency
  unit: seconds
  definition: Median time from request to the first returned chunk, including reasoning before the first visible answer where applicable, as published by Artificial Analysis.
  aggregation: last
  higher_is: bad
artificial_analysis_total_response_seconds:
  label: Artificial Analysis total response time
  unit: seconds
  definition: Median end-to-end response time for the benchmark workload as published by Artificial Analysis.
  aggregation: last
  higher_is: bad
livebench_overall_score:
  label: LiveBench overall score
  unit: score (0–100)
  definition: Mean of LiveBench category-average scores for the named release and model.
  aggregation: last
  higher_is: good
livebench_reasoning_score:
  label: LiveBench reasoning score
  unit: score (0–100)
  definition: Mean score across reasoning subtasks in the named LiveBench release.
  aggregation: last
  higher_is: good
livebench_coding_score:
  label: LiveBench coding score
  unit: score (0–100)
  definition: Mean score across coding subtasks in the named LiveBench release.
  aggregation: last
  higher_is: good
livebench_agentic_coding_score:
  label: LiveBench agentic coding score
  unit: score (0–100)
  definition: Mean score across agentic-coding subtasks in the named LiveBench release.
  aggregation: last
  higher_is: good
livebench_mathematics_score:
  label: LiveBench mathematics score
  unit: score (0–100)
  definition: Mean score across mathematics subtasks in the named LiveBench release.
  aggregation: last
  higher_is: good
livebench_data_analysis_score:
  label: LiveBench data-analysis score
  unit: score (0–100)
  definition: Mean score across data-analysis subtasks in the named LiveBench release.
  aggregation: last
  higher_is: good
livebench_language_score:
  label: LiveBench language score
  unit: score (0–100)
  definition: Mean score across language subtasks in the named LiveBench release.
  aggregation: last
  higher_is: good
livebench_instruction_following_score:
  label: LiveBench instruction-following score
  unit: score (0–100)
  definition: Mean score across instruction-following subtasks in the named LiveBench release.
  aggregation: last
  higher_is: good
livebench_cost_per_question_usd:
  label: LiveBench cost per question
  unit: USD per question
  definition: Total recorded model cost divided by question count across the selected LiveBench release scope.
  aggregation: last
  higher_is: neutral
livebench_cost_per_successful_task_usd:
  label: LiveBench cost per successful task
  unit: USD per successful task
  definition: LiveBench cost per question divided by the score fraction for the selected release scope; lower is cheaper for one scored success.
  aggregation: last
  higher_is: neutral
livebench_avg_input_tokens:
  label: LiveBench average input tokens
  unit: tokens per question
  definition: Average input tokens recorded across the selected LiveBench release workload.
  aggregation: last
  higher_is: neutral
livebench_avg_output_tokens:
  label: LiveBench average output tokens
  unit: tokens per question
  definition: Average output tokens recorded across the selected LiveBench release workload.
  aggregation: last
  higher_is: neutral
public_adoption_count:
  label: Public adoption disclosure
  unit: count as stated
  definition: Company-stated count exactly as scoped in the cited disclosure. Scopes and periods differ and the values are not directly comparable.
  aggregation: last
  higher_is: neutral
