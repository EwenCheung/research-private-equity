nport_value_usd:
  label: Fund holding value
  unit: USD
  definition: Value in USD a mutual fund reports for one Anthropic line in its N-PORT-P at the report date (its own fair-value mark).
  aggregation: last
  higher_is: neutral
nport_units:
  label: Fund holding shares
  unit: shares
  definition: Number of shares a mutual fund reports for one Anthropic line in its N-PORT-P. The mark per share is value divided by shares.
  aggregation: last
  higher_is: neutral
