# How each company is found in the attention sources. Verified live on 2026-10-05.
# wiki_product / wiki_company: English Wikipedia titles. Pages get renamed, so every title the topic has had is listed;
#   views of each title are summed (a reader lands on exactly one title, so nothing is counted twice).
#   Renames seen: Claude (language model) -> Claude (AI); Bard (chatbot) -> Gemini (chatbot) -> Google Gemini; XAI (company) -> SpaceXAI.
#   Claude had no article of its own before January 2024 (it was covered inside Anthropic), so its series starts then.
#   Gemini's model-family article is included so Gemini is comparable with Claude's single model-and-assistant article.
anthropic:
  wiki_product: [Claude (language model), Claude (AI)]
  wiki_company: [Anthropic]
openai:
  wiki_product: [ChatGPT]
  wiki_company: [OpenAI]
google-deepmind:
  wiki_product: [Bard (chatbot), Google Bard, Gemini (chatbot), Google Gemini, Gemini (language model)]
  wiki_company: [Google DeepMind]
xai:
  wiki_product: [Grok (chatbot)]
  wiki_company: [XAI (company), SpaceXAI]
mistral:
  wiki_product: [Le Chat]
  wiki_company: [Mistral AI]
cohere:
  wiki_company: [Cohere]
