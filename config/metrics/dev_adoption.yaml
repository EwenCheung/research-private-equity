pypi_downloads:
  label: PyPI downloads
  unit: downloads per day
  definition: pip downloads of a package on one UTC day, from PyPI's public download logs (includes CI and mirrors).
  aggregation: sum
  higher_is: good
npm_downloads:
  label: npm downloads
  unit: downloads per day
  definition: npm registry downloads of a package on one UTC day (includes CI).
  aggregation: sum
  higher_is: good
coauthored_commits:
  label: Commits co-authored by Claude
  unit: commits per week
  definition: GitHub commit-search count of public commits whose message contains the "Co-Authored-By Claude" trailer, Monday to Sunday.
  aggregation: sum
  higher_is: good
